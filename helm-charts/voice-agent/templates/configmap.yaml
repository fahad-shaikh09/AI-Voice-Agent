apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "voice-agent.fullname" . }}
  labels:
    {{- include "voice-agent.labels" . | nindent 4 }}
data:
  OLLAMA_HOST: {{ .Values.config.ollamaHost | quote }}
  OLLAMA_MODEL: {{ .Values.config.ollamaModel | quote }}
  WHISPER_MODEL: {{ .Values.config.whisperModel | quote }}
  PIPER_MODEL: {{ .Values.config.piperModel | quote }}
  PIPER_MODEL_DIR: {{ .Values.config.piperModelDir | quote }}
  HF_HOME: {{ .Values.config.hfHome | quote }}
